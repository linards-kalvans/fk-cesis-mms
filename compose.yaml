# fk-cesis-mms — local Docker smoke stack
#
# Deployed runtime configuration is owned by:
#   https://github.com/linards-kalvans/fk-cesis
#
# This compose file is kept in the app repo so developers can smoke-test the
# built image with Postgres, web, and qcluster locally. Do not treat this file
# as the production server source-of-truth.

name: fk-cesis-mms

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Postgres 18+ stores data under a version-specific subdir of this path,
    # which makes future `pg_upgrade --link` upgrades clean. Mount the parent,
    # not /var/lib/postgresql/data (the 16/17 convention).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${FK_CESIS_MMS_IMAGE:-codeberg.org/linards-kalvans/fk-cesis-mms}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Host-side port is configurable via WEB_HOST_PORT (.env) in case 8000
    # is already taken on the host. The container always listens on 8000.
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8000}:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/private-uploads:/app/private-uploads
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        exec gunicorn fk_cesis_mms.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --access-logfile -
        --error-logfile -

  qcluster:
    image: ${FK_CESIS_MMS_IMAGE:-codeberg.org/linards-kalvans/fk-cesis-mms}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/private-uploads:/app/private-uploads
    command: ["python", "manage.py", "qcluster"]
    # qcluster has no HTTP server; disable the image's curl-based healthcheck.
    healthcheck:
      disable: true

volumes:
  pgdata:
