{% if items %}
  <div class="fk-error-summary" id="error-summary">
    <p>Sekojošas kļūdas ir jāizlabo:</p>
    <ul>
      {% for item in items %}
        <li>
          {% if item.field == "__all__" %}
            {{ item.message }}
          {% else %}
            <a href="#id_{{ item.field }}">{{ item.label|default:item.field }}: {{ item.message }}</a>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </div>
{% endif %}

{% if error %}
  <div class="fk-error-summary" id="error-summary">
    <p>{{ error }}</p>
  </div>
{% endif %}
