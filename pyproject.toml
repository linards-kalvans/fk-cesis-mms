[project]
name = "fk-cesis-mms"
version = "0.1.0"
description = "FK Cēsis MMS — youth football club management MVP"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.0",
    "django>=5.0",
    "django-q2>=1.10.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[tool.ruff]
lint.extend-ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]
