name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/linards-kalvans/fk-cesis-mms

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fkmms
          POSTGRES_USER: fkmms
          POSTGRES_PASSWORD: fkmms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fkmms -d fkmms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-not-secret
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://fkmms:fkmms@localhost:5432/fkmms
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run pytest -q -m "not slow"
          else
            uv run pytest -q
          fi

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            printf 'tags=%s:dev\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR=$(tr -d '[:space:]' < VERSION)
          LAST_VERSION_SHA=$(git log -1 --format=%H -- VERSION)
          MINOR_OFFSET=$(git rev-list --count "$LAST_VERSION_SHA..HEAD")
          MINOR=$((MINOR_OFFSET + 1))
          VERSION_TAG="$MAJOR.$MINOR"
          {
            echo 'tags<<EOF'
            printf '%s:main\n' "$IMAGE_NAME"
            printf '%s:%s\n' "$IMAGE_NAME" "$VERSION_TAG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Computed version tag $VERSION_TAG"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
